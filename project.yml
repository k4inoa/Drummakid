name: Drummakid
options:
  deploymentTarget:
    iOS: 17.0
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
targets:
  Drummakid:
    type: application
    platform: iOS
    sources:
      - path: Drummakid/App
      - path: Drummakid/Resources/Assets.xcassets
        buildPhase: resources
      - path: Drummakid/Resources/stick_animation_alternating.gif
        buildPhase: resources
      - path: Drummakid/Resources/BuiltInDrumPack
        buildPhase: resources
    dependencies:
      - sdk: CoreMIDI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drummakid.app
        SWIFT_VERSION: 5.9
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: drummakid
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  DrummakidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrummakidTests
    dependencies:
      - target: Drummakid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drummakid.app.tests
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drummakid.app/Drummakid"
schemes:
  Drummakid:
    shared: true
    build:
      targets:
        Drummakid: all
        DrummakidTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DrummakidTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
